# Publishing the packages to npm, on a `vX.Y.Z` tag.
#
# No NPM_TOKEN. npm trusted publishing exchanges a short-lived GitHub OIDC token
# for a credential that is scoped to one package, valid for minutes, and issued
# only to the workflow npmjs.com was told to expect. There is no long-lived
# secret in this repository to leak, rotate or expire, and a fork cannot obtain
# one: GitHub refuses to mint an id token for a workflow it did not run from
# this repository.
#
# Trusted publishing is configured per package on npmjs.com against this file's
# path, so renaming or moving it stops every publish until that configuration
# is changed to match. A package that has never been published has nothing to
# configure yet: its first release is one manual publish, and the publisher is
# set up on npmjs.com after it.
#
# Provenance is on. An attestation ties each tarball to the public commit and
# workflow that built it, which is only worth anything because the source is
# public.

name: release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # The same gates a branch gets. A tag that published without them would make
  # the release the one build nobody checked.
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: pnpm format:check
      - run: pnpm lint
      # Build first: a package that depends on another one here resolves it
      # through its `dist`, which a fresh runner does not have until this runs.
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm test

  publish:
    runs-on: ubuntu-latest
    needs: [verify]
    environment: npm
    permissions:
      # The whole credential story. `id-token: write` lets this job ask GitHub
      # for a signed statement of what it is, which npm exchanges for a publish
      # token and builds the provenance attestation from.
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup

      # Built on this runner from this commit, never downloaded from `verify`:
      # the tarball somebody installs is the one compiled here.
      - run: pnpm build

      # Versions come from the manifests at the commit the tag points at, never
      # from the tag name: packages version independently under changesets, so
      # the tag marks the release rather than naming a version. pnpm skips every
      # package whose version is already on the registry, which makes a re-run a
      # no-op instead of a failure.
      - run: pnpm publish --recursive --access public --no-git-checks --report-summary
        env:
          NPM_CONFIG_PROVENANCE: "true"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: publish-summary
          path: pnpm-publish-summary.json
          retention-days: 365
          if-no-files-found: ignore
